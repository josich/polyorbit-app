# Builds the self-contained Android app on every push (Capacitor 8, Android 16 / API 36). Two flavours:
# - github: the APK for friends, published as a release; the phone downloads it from
#   https://github.com/josich/polyorbit-app/releases/latest/download/polyorbit.apk
# - play:   the App Bundle for Google Play (Pro gates on, Play Billing, no GitHub update card), signed with our key;
#   it is kept as a downloadable file on the run's page ("polyorbit-play-aab"), ready for the Play Console.
# Then an Android 16 emulator opens the GitHub APK and its screenshots are added to the release (a check of the screen
# edges, the camera cutout and the system bars on new Android).
name: Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [github, play]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: The Play flavour's mark
        if: matrix.flavor == 'play'
        run: python3 tools/store-patch.py www
      - name: Android project
        run: npx cap add android
      - name: The app's own native code
        run: |
          D=android/app/src/main/java/io/github/josich/polyorbit
          test -f "$D/MainActivity.java"
          cp native-src/*.java "$D/"
      - name: App icon
        run: |
          npx --yes @capacitor/assets@3 generate --android --assetPath assets \
            --iconBackgroundColor '#0C1015' --iconBackgroundColorDark '#0C1015' \
            --splashBackgroundColor '#0C1015' --splashBackgroundColorDark '#0C1015' || echo "icon step skipped"
      - name: Copy the web files
        run: npx cap sync android
      - name: Portrait, vibration, billing, links
        run: python3 tools/manifest.py android/app/src/main/AndroidManifest.xml
      - name: Dark system bars
        run: python3 tools/theme.py android/app/src/main/res/values/styles.xml
      - name: Version
        run: |
          python3 tools/version.py android/app/build.gradle ${{ github.run_number }} "$(cat www-version.txt)"
          grep -E "versionCode|versionName|targetSdk|compileSdk" android/app/build.gradle android/variables.gradle || true
      - name: Build
        run: |
          cd android
          if [ "${{ matrix.flavor }}" = play ]; then ./gradlew bundleRelease --no-daemon -q; else ./gradlew assembleRelease --no-daemon -q; fi
      - name: Sign
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          [ -n "$KS_B64" ] || { echo "The KS_B64 secret is missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          if [ "${{ matrix.flavor }}" = play ]; then
            jarsigner -keystore "$RUNNER_TEMP/ks.p12" -storetype PKCS12 -storepass:env KS_PASS -keypass:env KS_PASS \
              -sigalg SHA256withRSA -digestalg SHA-256 -signedjar polyorbit-play.aab \
              android/app/build/outputs/bundle/release/app-release.aab polyorbit
            rm -f "$RUNNER_TEMP/ks.p12"
            jarsigner -verify polyorbit-play.aab | tail -1
          else
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.p12" --ks-type PKCS12 --ks-key-alias polyorbit \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS --out polyorbit.apk aligned.apk
            rm -f "$RUNNER_TEMP/ks.p12"
            "$BT/apksigner" verify --print-certs polyorbit.apk | head -3
          fi
      - name: Keep the Play bundle
        if: matrix.flavor == 'play'
        uses: actions/upload-artifact@v4
        with:
          name: polyorbit-play-aab
          path: polyorbit-play.aab
          retention-days: 30
      - name: Keep the APK for the emulator check
        if: matrix.flavor == 'github'
        uses: actions/upload-artifact@v4
        with:
          name: polyorbit-apk
          path: polyorbit.apk
          retention-days: 3
      - name: Publish
        if: matrix.flavor == 'github'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Polyorbit app build ${{ github.run_number }}
          body: Install on Android - open this page on the phone and tap polyorbit.apk.
          files: polyorbit.apk
          make_latest: true

  android16:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: polyorbit-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 emulator, screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emu-shots.sh
      - name: Screenshots on the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: shots/*.png
