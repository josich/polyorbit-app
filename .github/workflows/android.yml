# Builds the self-contained Android app on every push and publishes it as a release.
# The phone downloads it from: https://github.com/josich/polyorbit-app/releases/latest/download/polyorbit.apk
name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Android project
        run: npx cap add android
      - name: App icon
        run: |
          npx --yes @capacitor/assets@3 generate --android --assetPath assets \
            --iconBackgroundColor '#0D1318' --iconBackgroundColorDark '#0D1318' \
            --splashBackgroundColor '#0D1318' --splashBackgroundColorDark '#0D1318' || echo "icon step skipped"
      - name: Copy the web files
        run: npx cap sync android
      - name: Portrait and vibration
        run: python3 tools/manifest.py android/app/src/main/AndroidManifest.xml
      - name: Version
        run: |
          V=$(cat www-version.txt)
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Build
        run: cd android && ./gradlew assembleRelease --no-daemon -q
      - name: Sign
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          [ -n "$KS_B64" ] || { echo "The KS_B64 secret is missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.p12" --ks-type PKCS12 --ks-key-alias polyorbit \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out polyorbit.apk aligned.apk
          rm -f "$RUNNER_TEMP/ks.p12"
          "$BT/apksigner" verify --print-certs polyorbit.apk | head -3
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Polyorbit app build ${{ github.run_number }}
          body: Install on Android - open this page on the phone and tap polyorbit.apk.
          files: polyorbit.apk
          make_latest: true
